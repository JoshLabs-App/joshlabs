<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>English +1 Course</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/english/icons/manifest.webmanifest?v=20260902-01">
<meta name="theme-color" content="#d63d70">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English +1">
<link rel="apple-touch-icon" href="/english/icons/apple-touch-icon.png">
<link rel="icon" href="/english/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f5;
    --surface: #ffffff;
    --surface-2: #fff3f7;
    --surface-3: #f5eeec;
    --ink: #241b1d;
    --ink-soft: #6b5d5f;
    --ink-faint: #a3908f;
    --accent: #d63d70;
    --accent-dim: #b8305e;
    --accent-soft: #f7d9e3;
    --accent-line: #e8b7c7;
    --good: #3f7d58;
    --good-soft: #e1efe4;
    --good-line: #b7d9c2;
    --line: #e6dcda;
    --line-strong: #cbbdbc;
    --code-bg: #f4eeed;
    --shadow-sm: 0 1px 2px rgba(36,27,29,0.05);
    --shadow-md: 0 1px 2px rgba(36,27,29,0.06), 0 8px 24px -12px rgba(36,27,29,0.16);
    --shadow-lg: 0 4px 8px rgba(36,27,29,0.06), 0 20px 40px -16px rgba(36,27,29,0.22);
    --radius-sm: 7px;
    --radius-md: 11px;
    --radius-lg: 16px;
    --tag-degree: #e8590c; --tag-degree-soft: #fff0e6;
    --tag-time: #1971c2; --tag-time-soft: #e7f1ff;
    --tag-place: #2f9e44; --tag-place-soft: #ebfbee;
    --tag-reason: #9c36b5; --tag-reason-soft: #f8ebfc;
    --tag-detail: #667085; --tag-detail-soft: #eef0f3;
    --tag-natural: #d63d70; --tag-natural-soft: #f7d9e3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1315; --surface: #231b1d; --surface-2: #2c1d24; --surface-3: #2a2123;
      --ink: #f3e9ea; --ink-soft: #c9b7ba; --ink-faint: #8f7d80;
      --accent: #ff6e9c; --accent-dim: #ff85ab; --accent-soft: #402530; --accent-line: #6b3a49;
      --good: #7bd6a0; --good-soft: #1f3327; --good-line: #2e4d3a;
      --line: #382c2e; --line-strong: #4a3b3e; --code-bg: #2a2123;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.55);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.35), 0 20px 40px -16px rgba(0,0,0,0.6);
      --tag-degree: #ff922b; --tag-degree-soft: #3a2a17; --tag-time: #4dabf7; --tag-time-soft: #17293a;
      --tag-place: #69db7c; --tag-place-soft: #16321c; --tag-reason: #da77f2; --tag-reason-soft: #331a38;
      --tag-detail: #98a2b3; --tag-detail-soft: #2b3038; --tag-natural: #ff6e9c; --tag-natural-soft: #402530;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1315; --surface: #231b1d; --surface-2: #2c1d24; --surface-3: #2a2123;
    --ink: #f3e9ea; --ink-soft: #c9b7ba; --ink-faint: #8f7d80;
    --accent: #ff6e9c; --accent-dim: #ff85ab; --accent-soft: #402530; --accent-line: #6b3a49;
    --good: #7bd6a0; --good-soft: #1f3327; --good-line: #2e4d3a;
    --line: #382c2e; --line-strong: #4a3b3e; --code-bg: #2a2123;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.55);
    --shadow-lg: 0 4px 8px rgba(0,0,0,0.35), 0 20px 40px -16px rgba(0,0,0,0.6);
    --tag-degree: #ff922b; --tag-degree-soft: #3a2a17; --tag-time: #4dabf7; --tag-time-soft: #17293a;
    --tag-place: #69db7c; --tag-place-soft: #16321c; --tag-reason: #da77f2; --tag-reason-soft: #331a38;
    --tag-detail: #98a2b3; --tag-detail-soft: #2b3038; --tag-natural: #ff6e9c; --tag-natural-soft: #402530;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-size: 17px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior-y: none;
  }
  @media (max-width: 860px) {
    html { font-size: 19px; }
  }
  a { color: inherit; }
  button { font: inherit; touch-action: manipulation; }
  a { touch-action: manipulation; }
  ::selection { background: var(--accent-soft); color: var(--accent-dim); }

  .app {
    display: grid;
    grid-template-columns: 292px 1fr;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }
  .brand-link {
    display: flex;
    align-items: center;
    gap: 9px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-align: left;
  }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(155deg, var(--accent), var(--accent-dim));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 0.92rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .brand-text .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.63rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
    line-height: 1.3;
  }
  .brand-text h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.02rem;
    margin: 0;
    line-height: 1.3;
  }
  .theme-toggle {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: var(--surface-2); }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  .progress-track {
    flex: 1;
    height: 7px;
    border-radius: 100px;
    background: var(--surface-3);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .progress-count { font-family: "JetBrains Mono", monospace; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 500; }

  .nav {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    padding: 10px 10px 20px;
  }
  .nav-home-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .nav-home-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-home-btn.active { background: var(--accent-soft); color: var(--accent); }
  .nav-home-btn .ic { font-size: 0.95rem; }

  .module-group { margin-bottom: 2px; }
  .module-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    padding: 9px 10px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 700;
    font-size: 0.84rem;
    color: var(--ink);
    border-radius: var(--radius-sm);
  }
  .module-head:hover { background: var(--surface-2); }
  .module-head .chev { transition: transform 0.2s ease; color: var(--ink-faint); font-size: 0.62rem; flex-shrink: 0; }
  .module-group.collapsed .chev { transform: rotate(-90deg); }
  .module-head .mh-emoji {
    width: 22px; height: 22px;
    border-radius: 7px;
    background: var(--mod-color, var(--accent));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.82rem;
    flex-shrink: 0;
  }
  .module-head .mh-name { flex: 1; text-align: left; }
  .module-head .mh-count {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    font-size: 0.7rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .module-head.all-done .mh-count { color: var(--good); }
  .module-list { list-style: none; margin: 0; padding: 0 0 10px 4px; position: relative; }
  .module-list::before {
    content: "";
    position: absolute;
    left: 15px; top: 2px; bottom: 10px;
    width: 1px;
    background: var(--line);
  }
  .module-group.collapsed .module-list { display: none; }

  .lesson-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 10px 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.86rem;
    color: var(--ink-soft);
    font-family: "IBM Plex Sans", sans-serif;
    position: relative;
  }
  .lesson-btn:hover { background: var(--surface-2); color: var(--ink); }
  .lesson-btn.active { background: var(--accent-soft); color: var(--mod-color, var(--accent)); font-weight: 700; }
  .lesson-btn:focus-visible, .nav-home-btn:focus-visible, .module-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .lesson-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
    width: 16px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .lesson-btn.active .lesson-num { color: var(--mod-color, var(--accent)); }
  .lesson-check {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .lesson-btn.done .lesson-check { background: var(--good); border-color: var(--good); }
  .lesson-btn.done .lesson-check::after { content: "✓"; color: var(--surface); font-size: 8px; line-height: 1; font-weight: 700; }
  .lesson-title-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Main shell ---------- */
  .main { overflow-y: auto; overscroll-behavior-y: contain; min-height: 0; position: relative; -webkit-overflow-scrolling: touch; }
  .scroll-progress {
    position: sticky;
    top: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    z-index: 5;
    width: 0%;
    transition: width 0.1s linear;
  }
  .main-inner {
    max-width: 740px;
    margin: 0 auto;
    padding: 40px 32px 100px;
  }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .breadcrumb button {
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--ink-faint); font: inherit;
  }
  .breadcrumb button:hover { color: var(--accent); }
  .breadcrumb .sep { opacity: 0.5; }
  .breadcrumb .current { color: var(--ink-soft); }

  .lesson-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .lesson-eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    color: var(--accent);
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lesson-eyebrow .dot { opacity: 0.5; }
  .lesson-header h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.75rem, 3.4vw, 2.4rem);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .mark-done-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: 14px;
    border: none;
    border-bottom: 3px solid var(--line-strong);
    background: var(--surface-3);
    color: var(--ink-soft);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: transform 0.08s ease;
  }
  .mark-done-btn:hover { color: var(--ink); }
  .mark-done-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
  .mark-done-btn.done { background: var(--good-soft); border-color: var(--good-line); color: var(--good); }
  .mark-done-btn.bounce { animation: doneBounce 0.4s ease; }
  @keyframes doneBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .mark-done-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .audio-box {
    margin: 22px 0 6px;
    padding: 14px 18px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .audio-box .label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent-dim);
    flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .audio-box audio { flex: 1; min-width: 220px; height: 34px; }
  .audio-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--mod-color, var(--accent));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.92rem;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s ease;
  }
  .audio-link-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
  .audio-link-btn:focus-visible { outline: 2px solid var(--accent-dim); outline-offset: 2px; }
  .audio-box .hint { font-size: 0.78rem; color: var(--ink-faint); }

  .lesson-body { margin-top: 30px; }
  .lesson-body h3 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.22rem;
    margin: 38px 0 12px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    letter-spacing: -0.005em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lesson-body h3:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .step-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .lesson-body p { margin: 0 0 14px; color: var(--ink); max-width: 66ch; font-size: 1.05rem; }
  .lesson-body strong { color: var(--ink); font-weight: 600; }
  .lesson-body em { color: var(--ink-soft); font-style: italic; }
  .lesson-body ul, .lesson-body ol { margin: 0 0 16px; padding-left: 1.4em; }
  .lesson-body ol { counter-reset: none; }
  .lesson-body li { margin-bottom: 6px; padding-left: 2px; font-size: 1.05rem; }
  .lesson-body hr { border: none; border-top: 1px solid var(--line); margin: 32px 0; }

  .lesson-body pre {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    overflow-x: auto;
    margin: 0 0 18px;
    font-family: "Nunito", "IBM Plex Sans", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.003em;
    line-height: 1.9;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .lesson-body pre.plus1-block {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    border-left: 3px solid var(--accent);
    position: relative;
  }
  .lesson-body pre.plus1-block::before {
    content: "+1";
    position: absolute;
    top: 10px; right: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--surface);
    padding: 1px 7px;
    border-radius: 100px;
    border: 1px solid var(--accent-line);
  }
  .lesson-body code {
    font-family: "Nunito", "IBM Plex Sans", sans-serif;
    font-weight: 700;
    font-size: 0.92em;
    background: var(--code-bg);
    padding: 1px 7px;
    border-radius: 4px;
  }
  .lesson-body pre code { background: none; padding: 0; font-weight: inherit; }

  /* ---------- Sentence ladder / variants blocks ---------- */
  .sentence-ladder, .sentence-variants {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0 0 20px;
  }
  .sentence-ladder .step-card, .sentence-variants .step-card {
    border-radius: 14px;
    padding: 14px 20px;
    font-family: "Nunito", "IBM Plex Sans", sans-serif;
    font-weight: 700;
    line-height: 1.55;
    font-size: 1.12rem;
    box-shadow: var(--shadow-sm);
  }
  .sentence-ladder .step-card {
    background: var(--surface-3);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .sentence-variants .step-card {
    background: var(--surface-2);
    border: 1.5px dashed var(--line-strong);
    color: var(--ink-soft);
  }

  /* ---------- Inline grammar tags (what got added at each +1 step) ---------- */
  .lesson-body mark {
    background: none;
    padding: 2px 8px;
    border-radius: 7px;
    font-weight: 800;
  }
  .tag-degree  { color: var(--tag-degree);  background: var(--tag-degree-soft); }
  .tag-time    { color: var(--tag-time);    background: var(--tag-time-soft); }
  .tag-place   { color: var(--tag-place);   background: var(--tag-place-soft); }
  .tag-reason  { color: var(--tag-reason);  background: var(--tag-reason-soft); }
  .tag-detail  { color: var(--tag-detail);  background: var(--tag-detail-soft); }
  .tag-natural { color: var(--tag-natural); background: var(--tag-natural-soft); }

  .tag-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .tag-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .tag-legend i {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: var(--radius-md); }
  .lesson-body table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.87rem;
  }
  .lesson-body th, .lesson-body td {
    border-bottom: 1px solid var(--line);
    padding: 9px 14px;
    text-align: left;
  }

function applyTheme(t) {
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}

document.getElementById("themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;

  try { localStorage.setItem("englishplus1_theme", next); } catch (e) {}
});

// ---------- tiny markdown renderer ----------
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\{\{(\w+):([^}]+)\}\}/g, '<mark class="tag-$1">$2</mark>');
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return s;
}
function renderHeading(text) {
  const stepMatch = text.match(/^Step\s+(\d+)\s*[—-]\s*(.*)$/);
  if (stepMatch) {
    return `<h3><span class="step-badge">${stepMatch[1]}</span>${inlineMd(stepMatch[2])}</h3>`;
  }
  return `<h3>${inlineMd(text)}</h3>`;
}
function mdToHtml(md) {
  const lines = md.split("\n");
  let html = "";
  let i = 0;
  while (i < lines.length) {
    let line = lines[i];

    if (line.trim() === "") { i++; continue; }
    if (line.trim() === "---") { html += "<hr>"; i++; continue; }

    if (/^###\s+/.test(line)) { html += renderHeading(line.replace(/^###\s+/, "")); i++; continue; }
    if (/^##\s+/.test(line)) { html += renderHeading(line.replace(/^##\s+/, "")); i++; continue; }
    if (/^#\s+/.test(line)) { html += renderHeading(line.replace(/^#\s+/, "")); i++; continue; }

    if (/^```/.test(line)) {
      const fenceMatch = line.match(/^```(\w*)/);
      const lang = fenceMatch ? fenceMatch[1] : "";
      i++;
      let code = [];
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      if (lang === "ladder" || lang === "variants") {
        const codeLines = code.filter(l => l.trim() !== "");
        const cls = lang === "ladder" ? "sentence-ladder" : "sentence-variants";
        html += `<div class="${cls}">` + codeLines.map(l =>
          `<div class="step-card"><span class="step-text">${inlineMd(l.trim())}</span></div>`
        ).join("") + `</div>`;
        continue;
      }
      const codeText = code.join("\n");
      const isPlus1 = /↓\s*\+1/.test(codeText);
      html += `<pre class="${isPlus1 ? "plus1-block" : ""}"><code>${escapeHtml(codeText)}</code></pre>`;
      continue;
    }

    if (/^\|/.test(line.trim())) {
      let rows = [];
      while (i < lines.length && /^\|/.test(lines[i].trim())) { rows.push(lines[i].trim()); i++; }
      const cellsOf = r => r.slice(1, -1).split("|").map(c => c.trim());
      const isSep = r => /^:?-+:?$/.test(r.replace(/\s/g, ""));
      const dataRows = rows.filter(r => { const cells = cellsOf(r); return !cells.every(isSep); });
      if (dataRows.length) {
        const head = cellsOf(dataRows[0]);
        html += '<div class="table-wrap"><table><thead><tr>' + head.map(h => `<th>${inlineMd(h)}</th>`).join("") + "</tr></thead><tbody>";
        for (let r = 1; r < dataRows.length; r++) {
          const cells = cellsOf(dataRows[r]);
          html += "<tr>" + cells.map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
        }
        html += "</tbody></table></div>";
      }
      continue;
    }

    if (/^-\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^-\s+/.test(lines[i])) { items.push(lines[i].replace(/^-\s+/, "")); i++; }
      html += "<ul>" + items.map(it => `<li>${inlineMd(it)}</li>`).join("") + "</ul>";
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\d+\.\s+/, "")); i++; }
      html += "<ol>" + items.map(it => `<li>${inlineMd(it)}</li>`).join("") + "</ol>";
      continue;
    }

    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,3}\s|```|\||-\s|\d+\.\s|---)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    html += `<p>${inlineMd(para.join(" "))}</p>`;
  }
  return html;
}

// ---------- progress helpers ----------
function moduleStats(mod) {
  const items = LESSONS.filter(l => l.module === mod);
  const done = items.filter(l => completed.has(l.num)).length;
  return { total: items.length, done, items };
}
function firstIncompleteInModule(mod) {
  const items = LESSONS.filter(l => l.module === mod);
  return items.find(l => !completed.has(l.num)) || items[0];
}
function nextLessonOverall() {
  const found = LESSONS.find(l => !completed.has(l.num));
  return found || LESSONS[0];
}

// ---------- sidebar ----------
const navEl = document.getElementById("nav");
let collapsedState = {};
try {
  const savedCollapsed = localStorage.getItem("englishplus1_collapsed");
  if (savedCollapsed) collapsedState = JSON.parse(savedCollapsed);
} catch (e) {}

let homeCollapsed = {};
try {
  const savedHomeCollapsed = localStorage.getItem("englishplus1_home_collapsed");
  if (savedHomeCollapsed) homeCollapsed = JSON.parse(savedHomeCollapsed);
} catch (e) {}

function renderNav() {
  navEl.innerHTML = "";

  const homeBtn = document.createElement("button");
  homeBtn.className = "nav-home-btn" + (view === "home" ? " active" : "");
  homeBtn.innerHTML = `<span class="ic">⌂</span><span>课程总览</span>`;
  homeBtn.addEventListener("click", goHome);
  navEl.appendChild(homeBtn);

  MODULE_ORDER.forEach(mod => {
    const meta = MODULE_META[mod];
    const stats = moduleStats(mod);
    const group = document.createElement("div");
    group.className = "module-group" + (collapsedState[mod] ? " collapsed" : "");
    group.style.setProperty("--mod-color", meta.color);

    const head = document.createElement("button");
    head.className = "module-head" + (stats.done === stats.total ? " all-done" : "");
    head.innerHTML = `<span class="chev">▾</span><span class="mh-emoji">${meta.emoji}</span><span class="mh-name">${meta.name}</span><span class="mh-count">${stats.done}/${stats.total}</span>`;
    head.addEventListener("click", () => {
      collapsedState[mod] = !collapsedState[mod];
      try { localStorage.setItem("englishplus1_collapsed", JSON.stringify(collapsedState)); } catch (e) {}
      group.classList.toggle("collapsed");
    });
    group.appendChild(head);

    const list = document.createElement("ul");
    list.className = "module-list";
    stats.items.forEach(l => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "lesson-btn" + (l.num === view ? " active" : "") + (completed.has(l.num) ? " done" : "");
      btn.innerHTML = `<span class="lesson-num">${String(l.num).padStart(2,"0")}</span><span class="lesson-check"></span><span class="lesson-title-txt">${escapeHtml(l.title)}</span>`;
      btn.addEventListener("click", () => selectLesson(l.num));
      li.appendChild(btn);
      list.appendChild(li);
    });
    group.appendChild(list);
    navEl.appendChild(group);
  });
}

function updateProgressBar() {
  const pct = Math.round((completed.size / LESSONS.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressCount").textContent = completed.size + "/" + LESSONS.length;
}

function closeMobileSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim").classList.remove("show");
}

function goHome() {
  view = "home";
  saveView();
  renderNav();
  renderMain();
  document.getElementById("main").scrollTop = 0;
  closeMobileSidebar();
}

function selectLesson(num) {
  view = num;
  saveView();
  renderNav();
  renderMain();
  document.getElementById("main").scrollTop = 0;
  closeMobileSidebar();
}

// ---------- main: home dashboard ----------
function renderHome() {
  const mainInner = document.getElementById("mainInner");
  const total = LESSONS.length;
  const pct = Math.round((completed.size / total) * 100);
  const circumference = 2 * Math.PI * 40;
  const offset = circumference * (1 - completed.size / total);

  const next = nextLessonOverall();
  const hasProgress = completed.size > 0;

  let html = `
    <div class="home-hero">
      <div class="ring-wrap">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle class="ring-track" cx="48" cy="48" r="40"></circle>
          <circle class="ring-fill" cx="48" cy="48" r="40" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="ring-label"><span class="n">${pct}%</span><span class="pct">${completed.size}/${total}</span></div>
      </div>
      <div class="home-hero-text">
        <p class="eyebrow2">English +1 · 雅思 5 分学习路径</p>
        <h1>从核心动词到雅思四项技能</h1>
        <p>118课，九大模块：口语骨架 → 日常行动 → 沟通观点 → 话题词汇 → 语法 → 写作 → 听力 → 阅读 → 口语独白。按顺序学，每课都接着上一课。</p>
      </div>
    </div>

    <div class="continue-card">
      <div>
        <p class="cc-label">${hasProgress ? "继续学习" : "从这里开始"}</p>
        <h3>第${next.num}课 · ${escapeHtml(next.title)}</h3>
      </div>
      <button class="cc-btn" id="continueBtn">${hasProgress ? "继续 →" : "开始学习 →"}</button>
    </div>

    <p class="section-label">九大模块</p>
    <div class="module-grid">
  `;

  MODULE_ORDER.forEach(mod => {
    const meta = MODULE_META[mod];
    const stats = moduleStats(mod);
    const modPct = Math.round((stats.done / stats.total) * 100);
    const allDone = stats.done === stats.total;
    html += `
      <button class="module-card" data-mod="${mod}" style="--mod-color:${meta.color}">
        <div class="mc-top">
          <span class="mc-icon">${meta.emoji}</span>
          ${allDone ? '<span class="mc-check">✓</span>' : `<span class="mc-range">第${meta.range}课</span>`}
        </div>
        <h4>${meta.name}</h4>
        <p style="margin:0;font-size:0.85rem;color:var(--ink-soft);">${meta.blurb}</p>
        <div class="mc-progress-track"><div class="mc-progress-fill" style="width:${modPct}%"></div></div>
        <div class="mc-foot">
          <span>${stats.done}/${stats.total} 完成</span>
          <span class="mc-cta">${stats.done === 0 ? "开始" : allDone ? "复习" : "继续"} →</span>
        </div>
      </button>
    `;
  });

  html += `</div>`;

  html += `<p class="section-label progress-overview-label">全部课程进度 · ${completed.size}/${total}</p><div class="progress-overview">`;
  MODULE_ORDER.forEach(mod => {
    const meta = MODULE_META[mod];
    const stats = moduleStats(mod);
    const isOpen = homeCollapsed[mod] !== true;
    html += `
      <div class="progress-group${isOpen ? " open" : ""}" data-mod="${mod}">
        <button class="progress-head" data-mod="${mod}">
          <span class="chev">▾</span>
          <span class="ph-name">${meta.name}</span>
          <span class="ph-count">${stats.done}/${stats.total}</span>
        </button>
        <ul class="progress-list">
          ${stats.items.map(l => `
            <li>
              <button class="progress-row${completed.has(l.num) ? " done" : ""}${l.num === view ? " active" : ""}" data-num="${l.num}">
                <span class="pr-num">${String(l.num).padStart(2, "0")}</span>
                <span class="pr-check"></span>
                <span class="pr-title">${escapeHtml(l.title)}</span>
              </button>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
  });
  html += `</div>`;

  mainInner.innerHTML = html;

  document.getElementById("continueBtn").addEventListener("click", () => selectLesson(next.num));
  mainInner.querySelectorAll(".module-card").forEach(card => {
    card.addEventListener("click", () => {
      const mod = card.dataset.mod;
      selectLesson(firstIncompleteInModule(mod).num);
    });
  });
  mainInner.querySelectorAll(".progress-head").forEach(head => {
    head.addEventListener("click", () => {
      const mod = head.dataset.mod;
      homeCollapsed[mod] = homeCollapsed[mod] !== true;
      try { localStorage.setItem("englishplus1_home_collapsed", JSON.stringify(homeCollapsed)); } catch (e) {}
      head.closest(".progress-group").classList.toggle("open");
    });
  });
  mainInner.querySelectorAll(".progress-row").forEach(row => {
    row.addEventListener("click", () => selectLesson(parseInt(row.dataset.num, 10)));
  });
}

// ---------- main: lesson ----------
function renderLesson(lessonNum) {
  const lesson = LESSONS.find(l => l.num === lessonNum);
  const mainInner = document.getElementById("mainInner");
  const meta = MODULE_META[lesson.module];
  const isDone = completed.has(lesson.num);

  const audioUrl = MODULE_AUDIO_URL[lesson.module] + "#lesson-" + lesson.num;
  const audioHtml = `<div class="audio-box"><a class="audio-link-btn" href="${audioUrl}" target="_blank" rel="noopener">🔊 播放本课音频</a><span class="hint">在新页面打开，本地语音合成朗读</span></div>`;

  const TAG_LEGEND_ITEMS = [
    ["degree", "程度"], ["time", "时间"], ["place", "地点"],
    ["reason", "原因"], ["detail", "补充"], ["natural", "更地道"],
  ];
  const usedTags = TAG_LEGEND_ITEMS.filter(([key]) => lesson.body.includes(`{{${key}:`));
  const legendHtml = usedTags.length
    ? `<div class="tag-legend">` + usedTags.map(([key, label]) =>
        `<span><i style="background:var(--tag-${key})"></i>${label}</span>`
      ).join("") + `</div>`
    : "";

  mainInner.style.setProperty("--mod-color", meta.color);
  mainInner.innerHTML = `
    <div class="breadcrumb">
      <button id="crumbHome">课程总览</button>
      <span class="sep">/</span>
      <button id="crumbModule">${meta.name}</button>
      <span class="sep">/</span>
      <span class="current">第${lesson.num}课</span>
    </div>
    <p class="lesson-eyebrow"><span class="mh-emoji">${meta.emoji}</span>${meta.name}<span class="dot">·</span>第${lesson.num}课 / ${LESSONS.length}</p>
    <div class="lesson-header">
      <h2>${escapeHtml(lesson.title)}</h2>
      <button class="mark-done-btn ${isDone ? "done" : ""}" id="markDoneBtn">${isDone ? "✓ 已完成" : "标记完成"}</button>
    </div>
    ${audioHtml}
    ${legendHtml}
    <div class="lesson-body">${mdToHtml(lesson.body)}</div>
    <div class="nav-footer" id="navFooter"></div>
  `;

  document.getElementById("crumbHome").addEventListener("click", goHome);
  document.getElementById("crumbModule").addEventListener("click", () => selectLesson(firstIncompleteInModule(lesson.module).num));

  document.getElementById("markDoneBtn").addEventListener("click", () => {
    const wasDone = completed.has(lesson.num);
    if (wasDone) completed.delete(lesson.num);
    else completed.add(lesson.num);
    saveProgress();
    renderLesson(lesson.num);
    renderNav();
    updateProgressBar();
    if (!wasDone) {
      const btn = document.getElementById("markDoneBtn");
      if (btn) { btn.classList.add("bounce"); setTimeout(() => btn.classList.remove("bounce"), 400); }
    }
  });

  const idx = LESSONS.findIndex(l => l.num === lesson.num);
  const prev = idx > 0 ? LESSONS[idx - 1] : null;
  const next = idx < LESSONS.length - 1 ? LESSONS[idx + 1] : null;
  const footer = document.getElementById("navFooter");
  const prevBtn = document.createElement("button");
  prevBtn.disabled = !prev;
  prevBtn.innerHTML = prev ? `<span class="nf-label">← 上一课</span><span class="nf-title">${escapeHtml(prev.title)}</span>` : `<span class="nf-label">← 上一课</span>`;
  if (prev) prevBtn.addEventListener("click", () => selectLesson(prev.num));
  const nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  nextBtn.disabled = !next;
  nextBtn.innerHTML = next ? `<span class="nf-label">下一课 →</span><span class="nf-title">${escapeHtml(next.title)}</span>` : `<span class="nf-label">下一课 →</span>`;
  if (next) nextBtn.addEventListener("click", () => selectLesson(next.num));
  footer.appendChild(prevBtn);
  footer.appendChild(nextBtn);
}

function renderMain() {
  if (view === "home") renderHome();
  else renderLesson(view);
  updateProgressBar();
  updateScrollProgress();
}

// ---------- scroll progress ----------
function updateScrollProgress() {
  const main = document.getElementById("main");
  const bar = document.getElementById("scrollProgress");
  const scrollable = main.scrollHeight - main.clientHeight;
  const pct = scrollable > 0 ? (main.scrollTop / scrollable) * 100 : 0;
  bar.style.width = pct + "%";
}
document.getElementById("main").addEventListener("scroll", updateScrollProgress);

// ---------- keyboard navigation ----------
document.addEventListener("keydown", (e) => {
  if (typeof view !== "number") return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  const idx = LESSONS.findIndex(l => l.num === view);
  if (e.key === "ArrowRight" && idx < LESSONS.length - 1) selectLesson(LESSONS[idx + 1].num);
  if (e.key === "ArrowLeft" && idx > 0) selectLesson(LESSONS[idx - 1].num);
  if (e.key === "Escape") closeMobileSidebar();
});

// ---------- wiring ----------
document.getElementById("brandHome").addEventListener("click", goHome);
document.getElementById("sidebarToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("scrim").classList.add("show");
});
document.getElementById("scrim").addEventListener("click", closeMobileSidebar);

// ---------- install guide ---------- //
const INSTALL_STEPS = {
  ios: [
    `点击 Safari 底部工具栏的<span class="install-icon-inline">⬆️</span><b>分享</b>按钮`,
    `在弹出菜单里向下滑，找到<b>添加到主屏幕</b>`,
    `右上角点<b>添加</b>，完成`,
  ],
  android: [
    `点击 Chrome 右上角的<span class="install-icon-inline">⋮</span>菜单按钮`,
    `选择<b>添加到主屏幕</b>（或"安装应用"）`,
    `确认<b>添加</b>，完成`,
  ],
  desktop: [
    `点击地址栏右侧的<b>安装</b>图标（如果显示的话）`,
    `或者直接把这个页面加入书签，方便随时回来`,
  ],
};

function detectPlatform() {
  const ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/.test(ua)) return "ios";
  if (/Android/.test(ua)) return "android";
  return "desktop";
}

let currentInstallTab = detectPlatform();

function renderInstallSteps() {
  const stepsEl = document.getElementById("installSteps");
  stepsEl.innerHTML = INSTALL_STEPS[currentInstallTab]
    .map(text => `<li><span class="install-num"></span><span class="install-step-text">${text}</span></li>`)
    .join("");
  document.querySelectorAll(".install-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.platform === currentInstallTab);
  });
}

function openInstallGuide() {
  renderInstallSteps();
  document.getElementById("installOverlay").classList.add("show");
}
function closeInstallGuide() {
  document.getElementById("installOverlay").classList.remove("show");
  if (document.getElementById("installDontRemind").checked) {
    try { localStorage.setItem("englishplus1_install_dismissed", "1"); } catch (e) {}
  }
}

document.getElementById("installBtn").addEventListener("click", openInstallGuide);
document.getElementById("installClose").addEventListener("click", closeInstallGuide);
document.getElementById("installOverlay").addEventListener("click", (e) => {
  if (e.target.id === "installOverlay") closeInstallGuide();
});
document.querySelectorAll(".install-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    currentInstallTab = tab.dataset.platform;
    renderInstallSteps();
  });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("installOverlay").classList.contains("show")) {
    closeInstallGuide();
  }
});

// auto-show once for mobile visitors who haven't dismissed it
(function autoShowInstallGuide() {
  const platform = detectPlatform();
  if (platform === "desktop") return;
  let dismissed = false;
  try { dismissed = localStorage.getItem("englishplus1_install_dismissed") === "1"; } catch (e) {}
  if (dismissed) return;
  const isStandalone = window.matchMedia && (
    window.matchMedia("(display-mode: standalone)").matches ||
    window.matchMedia("(display-mode: fullscreen)").matches
  );
  if (isStandalone || navigator.standalone) return;
  setTimeout(openInstallGuide, 1500);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/english/sw.js").catch(() => {});
  });
}

renderNav();
renderMain();
</script>
