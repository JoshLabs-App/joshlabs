<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">男人生命阶段图</title>
  <desc id="desc">Adam、Zakar、Gibbor、Enosh、Ish、Zaken 六个生命阶段。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2732}.h{font-size:34px;font-weight:900}.b{font-size:27px;font-weight:850}.s{font-size:22px;font-weight:700}.box{fill:#fff;stroke:#d7e7de;stroke-width:3}.line{stroke:#166b4a;stroke-width:5;fill:none;stroke-linecap:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#166b4a"/></marker></defs>
  <rect x="24" y="24" width="1072" height="712" rx="38" fill="#fff" stroke="#d7e7de" stroke-width="3"/>
  <text x="560" y="82" text-anchor="middle" class="h">生命阶段图：雄性的旅程</text>
  <path class="line" d="M125 210H995" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <rect class="box" x="58" y="126" width="135" height="150" rx="24"/><text class="b" x="125" y="178">Adam</text><text class="s" x="125" y="218">创造阶段</text><text class="s" x="125" y="252">0-20</text>
    <rect class="box" x="245" y="126" width="135" height="150" rx="24"/><text class="b" x="312" y="178">Zakar</text><text class="s" x="312" y="218">青春期</text><text class="s" x="312" y="252">13-25</text>
    <rect class="box" x="432" y="126" width="135" height="150" rx="24"/><text class="b" x="499" y="178">Gibbor</text><text class="s" x="499" y="218">战士阶段</text><text class="s" x="499" y="252">20-40</text>
    <rect class="box" x="619" y="126" width="135" height="150" rx="24"/><text class="b" x="686" y="178">Enosh</text><text class="s" x="686" y="218">受伤阶段</text><text class="s" x="686" y="252">40-50</text>
    <rect class="box" x="806" y="126" width="135" height="150" rx="24"/><text class="b" x="873" y="178">Ish</text><text class="s" x="873" y="218">成熟阶段</text><text class="s" x="873" y="252">50-60</text>
    <rect class="box" x="936" y="340" width="135" height="150" rx="24"/><text class="b" x="1003" y="392">Zaken</text><text class="s" x="1003" y="432">智者阶段</text><text class="s" x="1003" y="466">60+</text>
  </g>
  <g class="s">
    <text x="92" y="360">• 恩赐和天赋</text><text x="92" y="394">• 接受并发展</text>
    <text x="285" y="360">• 性能量</text><text x="285" y="394">• 精通或奴役</text>
    <text x="455" y="360">• 自我成就驱动</text><text x="455" y="394">• 战斗中的生命</text>
    <text x="650" y="360">• 强大的再评价</text><text x="650" y="394">• 新生或伤痕</text>
    <text x="92" y="535">• 更深层的意义</text><text x="92" y="569">• 战略性行动和辅导</text>
    <text x="455" y="535">• 行为模范</text><text x="455" y="569">• 特殊的贡献</text><text x="455" y="603">• 留下传奇</text>
  </g>
