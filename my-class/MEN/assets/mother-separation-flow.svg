<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">男人与母亲健康分开的关系图</title>
  <desc id="desc">从母子一体到身体分离、情感分离，最后与妻子联合。</desc>
  <defs>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2732}.h{font-size:31px;font-weight:900}.s{font-size:23px;font-weight:750}.node{fill:#fff;stroke:#d7e7de;stroke-width:3}.accent{fill:#eef6ef}.line{stroke:#166b4a;stroke-width:5;fill:none;stroke-linecap:round}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#166b4a"/></marker>
  </defs>
  <rect x="24" y="24" width="1132" height="312" rx="38" fill="#fff" stroke="#d7e7de" stroke-width="3"/>
  <g>
    <rect x="70" y="110" width="210" height="110" rx="28" class="accent" stroke="#d7e7de" stroke-width="3"/><text x="175" y="176" text-anchor="middle" class="h">母子一体</text>
    <rect x="342" y="94" width="230" height="142" rx="28" class="node"/><text x="457" y="153" text-anchor="middle" class="s">健康的身体上分离</text><text x="457" y="190" text-anchor="middle" class="s">（分娩）</text>
    <rect x="634" y="94" width="230" height="142" rx="28" class="node"/><text x="749" y="153" text-anchor="middle" class="s">健康的情感上分离</text><text x="749" y="190" text-anchor="middle" class="s">建立边界</text>
    <rect x="926" y="110" width="190" height="110" rx="28" class="accent" stroke="#d7e7de" stroke-width="3"/><text x="1021" y="176" text-anchor="middle" class="h">与妻子联合</text>
  </g>
  <path class="line" d="M282 165H332" marker-end="url(#arrow)"/><path class="line" d="M574 165H624" marker-end="url(#arrow)"/><path class="line" d="M866 165H916" marker-end="url(#arrow)"/>
</svg>
