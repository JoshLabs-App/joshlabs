<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用分析 · JoshLabs</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="assets/icons/joshlabs.svg" type="image/svg+xml">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .tj-wrap { max-width: var(--max); margin: 0 auto; padding: 0 1.25rem; }
    .tj-header { padding: 2rem 0 1.25rem; border-bottom: 1px solid var(--line); }
    .tj-header h1 { font-size: 1.375rem; font-weight: 700; margin: 0 0 1rem; }
    .tj-products { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tj-tab {
      padding: 0.35rem 0.875rem; border-radius: 2rem; border: 1px solid var(--line);
      background: none; color: var(--fg-soft); font: inherit; cursor: pointer; font-size: 0.875rem;
      transition: background 0.15s, color 0.15s;
    }
    .tj-tab[aria-selected=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .tj-range { display: flex; gap: 0.5rem; margin: 1.25rem 0 1.25rem; flex-wrap: wrap; }
    .tj-range button {
      padding: 0.3rem 0.75rem; border-radius: 2rem; border: 1px solid var(--line);
      background: none; color: var(--fg-soft); font: inherit; cursor: pointer; font-size: 0.8125rem;
    }
    .tj-range button[aria-pressed=true] { background: var(--surface); color: var(--fg); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
    .tj-kpi { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .tj-kpi-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 1rem;
      border: 1px solid var(--line); box-shadow: var(--shadow-sm);
    }
    .tj-kpi-card b { display: block; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.2rem; color: var(--fg); }
    .tj-kpi-card span { font-size: 0.8125rem; color: var(--muted); }
    .tj-map-wrap {
      border-radius: var(--radius-md); overflow: hidden;
      background: var(--surface); border: 1px solid var(--line);
      margin-bottom: 1.25rem; position: relative;
    }
    .tjmap { width: 100%; display: block; }
    .tjmap circle { opacity: 0.75; }
    .tjmap path { stroke: var(--bg); stroke-width: 0.5; transition: opacity 0.1s; }
    .tjmap path:hover { opacity: 0.8; }
    .tj-tip {
      position: absolute; background: var(--surface); border: 1px solid var(--line-strong);
      padding: 0.25rem 0.625rem; border-radius: var(--radius-sm); font-size: 0.8125rem;
      pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-sm); z-index: 10;
    }
    /* Section heading with optional right-side content */
    .tj-section-hd {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin: 0 0 0.75rem;
    }
    .tj-section-hd > span {
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    /* Map legend */
    .tj-map-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }
    .tj-legend-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--fg-soft); }
    .tj-legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tj-legend-fill { display: inline-block; width: 14px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    /* KPI card with product-color accent */
    .tj-kpi-accent {
      border-left: 3px solid var(--card-accent, var(--line));
      padding-left: calc(1rem - 2px);
    }
    .tj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .tj-section h2 { font-size: 0.75rem; font-weight: 600; margin: 0 0 0.625rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .tj-list { list-style: none; margin: 0; padding: 0; font-size: 0.875rem; }
    .tj-list li { display: flex; justify-content: space-between; align-items: baseline; padding: 0.375rem 0; border-bottom: 1px solid var(--line); gap: 0.5rem; }
    .tj-list li:last-child { border-bottom: none; }
    .tj-list li b { font-weight: 600; white-space: nowrap; color: var(--fg); font-size: 0.875rem; }
    .tj-list li span { color: var(--fg-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.875rem; }
    .tj-bars li { display: flex; align-items: center; gap: 0.625rem; padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
    .tj-bars li:last-child { border-bottom: none; }
    .tj-bar { height: 5px; border-radius: 3px; background: var(--brand-amber); flex-shrink: 0; transition: width 0.3s; }
    .tj-bars li span { font-size: 0.8125rem; color: var(--fg-soft); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tj-bars li b { font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
    .tj-recent-title { font-size: 0.9375rem; font-weight: 600; margin: 1.75rem 0 0.875rem; }
    .tj-recent { list-style: none; margin: 0; padding: 0; }
    .tj-recent li { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: start; padding: 0.625rem 0; border-bottom: 1px solid var(--line); font-size: 0.8125rem; }
    .tj-recent li:last-child { border-bottom: none; }
    .tj-recent time { color: var(--muted); margin-right: 0.5rem; font-variant-numeric: tabular-nums; }
    .tj-recent .rpage { font-weight: 500; color: var(--fg); }
    .tj-recent .rmeta { color: var(--muted); margin-top: 0.15rem; }
    .tj-recent b { font-weight: 600; white-space: nowrap; color: var(--fg); font-size: 0.8125rem; }
    .tj-note { color: var(--muted); font-size: 0.8125rem; margin: 1rem 0 3rem; }
    .tj-msg { color: var(--muted); font-size: 0.875rem; padding: 3rem 0; text-align: center; }
    .tj-content { padding: 0 0 4rem; }

    /* Charts */
    .tj-chart-section { margin-bottom: 1.5rem; }
    .tj-chart-section h2 { font-size: 0.75rem; font-weight: 600; margin: 0 0 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .tj-chart-wrap { width: 100%; margin: 0; }
    .tj-chart-empty { color: var(--muted); font-size: 0.875rem; padding: 2.5rem 0; text-align: center; }

    /* Trend badges — inline by default; KPI card positions them absolutely */
    .tj-trend-up, .tj-trend-dn {
      display: inline-block; font-size: 0.6875rem; font-weight: 600;
      padding: 2px 5px; border-radius: 10px; white-space: nowrap; line-height: 1.4;
    }
    .tj-trend-up { color: #059669; background: rgba(16,185,129,0.12); }
    .tj-trend-dn { color: #dc2626; background: rgba(220,38,38,0.1); }
    .tj-kpi-card { position: relative; }
    .tj-kpi-card .tj-trend-up, .tj-kpi-card .tj-trend-dn { position: absolute; top: 0.5rem; right: 0.5rem; }

    /* Overview header summary stats */
    .tj-ov-header {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
      gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .tj-ov-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0.875rem 1rem; }
    .tj-ov-stat b { display: block; font-size: 1.375rem; font-weight: 700; margin-bottom: 0.2rem; }
    .tj-ov-stat span { font-size: 0.75rem; color: var(--muted); }

    /* Overview product cards grid */
    .tj-ov-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr));
      gap: 0.875rem; margin-bottom: 2rem;
    }
    .tj-pcard {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-md); padding: 1rem;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; outline: none;
    }
    .tj-pcard:hover, .tj-pcard:focus-visible {
      border-color: var(--pc, var(--line-strong));
      box-shadow: 0 0 0 1px var(--pc, var(--line-strong));
    }
    .tj-pcard-name {
      font-size: 0.6875rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--pc, var(--muted)); margin-bottom: 0.75rem;
    }
    .tj-pcard-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.5rem; }
    .tj-pcard-kpi { font-size: 1.625rem; font-weight: 700; color: var(--fg); line-height: 1; }
    .tj-pcard-lbl { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .tj-pcard-foot { margin-top: 0.625rem; font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 0.4rem; }

    /* Cabinet-X app stats table */
    .tj-cx-section { margin-bottom: 1.5rem; }
    .tj-cx-section h2 { font-size: 0.75rem; font-weight: 600; margin: 0 0 0.625rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .tj-cx-table-wrap { overflow-x: auto; }
    .tj-cx-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    .tj-cx-table th, .tj-cx-table td { padding: 0.35rem 0.6rem; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .tj-cx-table th:first-child, .tj-cx-table td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
    .tj-cx-table thead th { color: var(--muted); font-weight: 600; }
    .tj-cx-table tbody tr:last-child td { border-bottom: none; }

    /* Auth overlay */
    .tj-auth {
      max-width: 22rem; margin: 5rem auto; padding: 0 1.25rem;
    }
    .tj-auth-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 1.75rem; box-shadow: var(--shadow-md); text-align: center;
    }
    .tj-auth h1 { font-size: 1.125rem; font-weight: 700; margin: 0 0 0.5rem; }
    .tj-auth-desc { font-size: 0.8125rem; color: var(--muted); margin: 0 0 1.5rem; }
    .tj-auth-google { display: flex; justify-content: center; }
    .tj-auth-err { color: #c0392b; font-size: 0.8125rem; min-height: 1.25em; margin-top: 1rem; }
  </style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="shell topbar__inner">
    <a class="brand" href="/">
      <span class="brand__mark" aria-hidden="true">JL</span>
      <span class="brand__name">Josh<span class="wordmark__labs">Labs</span></span>
    </a>
    <button id="tj-key-btn" style="background:none;border:none;color:var(--muted);font:inherit;font-size:0.8125rem;cursor:pointer;padding:0.25rem 0.625rem;border-radius:var(--radius-sm);">
      退出登录
    </button>
  </div>
</header>

<!-- Auth UI -->
<div id="tj-auth-ui" hidden>
  <div class="tj-auth">
    <div class="tj-auth-card">
      <h1>管理登录</h1>
      <p class="tj-auth-desc">使用 Google 账号登录</p>
      <div class="tj-auth-google">
        <div id="tj-google-btn"></div>
      </div>
      <div class="tj-auth-err" id="tj-auth-err" role="alert"></div>
    </div>
  </div>
</div>

<!-- Main dashboard -->
<div id="tj-main" hidden>
  <div class="tj-wrap">
    <div class="tj-header">
      <h1>使用分析</h1>
      <div class="tj-products" id="tj-products" role="tablist">
        <button class="tj-tab" role="tab" aria-selected="true"  data-product="overview">总览</button>
        <button class="tj-tab" role="tab" aria-selected="false" data-product="cabinetx">Cabinet-X</button>
        <button class="tj-tab" role="tab" aria-selected="false" data-product="joshmoney">JoshMoney</button>
      </div>
    </div>
    <div class="tj-content" id="tj-content"></div>
  </div>
</div>

<script src="assets/tj.js" defer></script>
</body>
</html>
