name: Deploy to Cloudflare Pages

# 只留手动触发：线上一律用本机 `node scripts/publish.mjs` 发布，push 只是备份（docs/DECISIONS.md D-5）
on:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 652050e08d4a384c7cbe975ea02fb52c
          command: pages deploy . --project-name=joshlabs2026 --branch main
